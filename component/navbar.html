<header id="main-navbar" class="bg-surface border-b border-outline-variant/30 sticky top-0 z-50">
  <div class="flex justify-between items-center h-16 px-4 md:px-16 w-full max-w-7xl mx-auto">
    
    <div data-action="nav-tab" data-tab="Market" class="flex items-center gap-2 cursor-pointer group">
      <div class="bg-primary/10 p-1.5 rounded-lg">
         <span class="font-bold text-primary">GardenShare</span>
      </div>
    </div>

    <nav id="desktop-nav" class="hidden md:flex items-center gap-6">
      <button data-action="nav-tab" data-tab="Market" class="nav-btn active">Market</button>
      <button data-action="nav-tab" data-tab="Community" class="nav-btn">Community</button>
      <button data-action="nav-tab" data-tab="My Garden" class="nav-btn">My Garden</button>
    </nav>

    <div class="flex items-center gap-3">
      
      <div class="relative">
        <button data-action="toggle-notif" class="relative p-2 rounded-full cursor-pointer">
          <span id="notif-badge" class="hidden absolute top-1.5 right-1.5 w-2 h-2 bg-red-500 rounded-full"></span>
        </button>
        <div id="notif-dropdown" class="hidden absolute right-0 mt-2 w-80 bg-white border rounded-xl shadow-xl z-50 p-3">
          <div class="flex justify-between border-b pb-2 mb-2">
            <span class="font-bold">Notifications</span>
          </div>
          <div id="notif-list" class="flex flex-col gap-2 max-h-60 overflow-y-auto"></div>
        </div>
      </div>

      <button data-action="open-cart" class="relative p-2 rounded-full cursor-pointer">
        <span id="cart-badge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[10px] px-1.5 rounded-full">0</span>
      </button>

      <div data-action="nav-tab" data-tab="Profile" class="ml-2 flex items-center cursor-pointer">
        <img src="profile-placeholder.jpg" class="w-9 h-9 rounded-full object-cover" alt="User">
      </div>
    </div>
  </div>
</header>
