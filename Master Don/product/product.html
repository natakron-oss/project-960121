<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product List</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      padding: 20px;
    }
    h1, h2 {
      color: #333;
    }
    a {
      text-decoration: none;
      color: #4CAF50;
      font-weight: bold;
      margin-bottom: 10px;
      display: inline-block;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: #fff;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    th, td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #4CAF50;
      color: white;
    }
    tr:hover {
      background-color: #f1f1f1;
    }
    .icon {
      cursor: pointer;
      margin-right: 5px;
      font-size: 18px;
    }
  </style>
</head>
<body>
  <h1>Product Management System</h1>
  <a href="addProduct.html">➕ Add Product</a>
  

  <h2>Product List</h2>
  <table id="productTable">
    <thead>
      <tr>
        <th>Product Name</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      <!-- Product rows will appear here -->
    </tbody>
  </table>

  <script>
    // สินค้าเริ่มต้น
    let products = JSON.parse(localStorage.getItem('products')) || [
      {name: 'Smartphone', price: 25000, quantity: 150},
      {name: 'Tablet', price: 15000, quantity: 200},
      {name: 'Headset', price: 850, quantity: 300},
      {name: 'Smartphone Cover', price: 1250, quantity: 200},
      {name: 'Power Adapter', price: 790, quantity: 175}
    ];

    function renderTable() {
      const tbody = document.querySelector('#productTable tbody');
      tbody.innerHTML = '';
      products.forEach((p, index) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${p.name}</td>
          <td>${p.price}</td>
          <td>${p.quantity}</td>
          <td>
            <span class="icon" onclick="editProduct(${index})">✏️</span>
            <span class="icon" onclick="deleteProduct(${index})">🗑️</span>
          </td>
        `;
        tbody.appendChild(row);
      });
      // บันทึกสถานะล่าสุดใน localStorage
      localStorage.setItem('products', JSON.stringify(products));
    }

    function editProduct(index) {
      const p = products[index];
      const newName = prompt('Product name:', p.name);
      const newPrice = parseFloat(prompt('Product price:', p.price));
      const newQuantity = parseInt(prompt('Product quantity:', p.quantity));
      if(newName && !isNaN(newPrice) && !isNaN(newQuantity)) {
        products[index] = {name: newName, price: newPrice, quantity: newQuantity};
        renderTable();
      }
    }

    function deleteProduct(index) {
      if(confirm('Are you sure you want to delete this product?')) {
        products.splice(index, 1);
        renderTable();
      }
    }

    // โหลด table ตอนหน้าเปิด
    renderTable();
  </script>
</body>
</html>
