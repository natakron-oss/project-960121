<!DOCTYPE html>
<html>
<head>
  <title>Suggest a Recipe - Recipe World</title>
  <link rel="stylesheet" type="text/css" href="main.css">
</head>
<body>

  <div class="header">
    <h1>Recipe World</h1>
    <ul class="nav">
      <li><a href="home.html">Home</a></li>
      <li><a href="recipes.html">Recipes</a></li>
      <li><a href="suggest.html">Suggest</a></li>
    </ul>
  </div>

  <div class="main-content">
    <h2>Suggest a recipe</h2>

    <form>
      <label for="recipe-name">Recipe Name</label>
      <input type="text" id="recipe-name" name="recipe-name">

      <label for="ingredients">Ingredients</label>
      <textarea id="ingredients" name="ingredients"></textarea>

      <label for="your-name">Your Name</label>
      <input type="text" id="your-name" name="your-name">

      <label for="your-email">Your Email</label>
      <input type="text" id="your-email" name="your-email">

      <label for="newsletter">Get Newsletter?</label>
      <input type="checkbox" id="newsletter" name="newsletter">

      <input type="submit" value="Submit the recipe">
    </form>

  </div>

  <div class="footer">
    <p>&copy; 2014 - Recipe World</p>
  </div>

</body>
</html>
