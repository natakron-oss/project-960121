<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สั่งซื้อสำเร็จ – Gardenshare</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Noto+Serif+Thai:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --green: #2d7a4f; --green-soft: #e8f5ee; --border: #e0e8e3;
      --text: #1a1f1c; --muted: #7a8c82; --bg: #f4f7f5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Sarabun', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 48px 40px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      animation: popIn .5s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes popIn {
      from { transform: scale(.8); opacity: 0; }
      to   { transform: scale(1);  opacity: 1; }
    }

    /* checkmark animation */
    .check-circle {
      width: 90px; height: 90px;
      border-radius: 50%;
      background: var(--green-soft);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      position: relative;
    }
    .check-circle::after {
      content: '';
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      border: 3px solid var(--green);
      animation: ringPop .6s ease forwards;
      opacity: 0;
    }
    @keyframes ringPop {
      0%   { transform: scale(.6); opacity: 1; }
      100% { transform: scale(1.15); opacity: 0; }
    }
    .check-circle i { font-size: 38px; color: var(--green); }

    h1 {
      font-family: 'Noto Serif Thai', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 28px;
      line-height: 1.6;
    }

    .order-box {
      background: var(--green-soft);
      border: 1px solid #bbf7d0;
      border-radius: 12px;
      padding: 16px 20px;
      margin-bottom: 28px;
      text-align: left;
    }
    .order-row {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      margin-bottom: 6px;
    }
    .order-row:last-child { margin-bottom: 0; }
    .order-row .label { color: var(--muted); }
    .order-row .value { font-weight: 700; color: var(--text); }
    .order-row .value.id { color: var(--green); font-family: 'Noto Serif Thai', serif; }

    .info-note {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: #92400e;
      display: flex;
      align-items: flex-start;
      gap: 10px;
      text-align: left;
      margin-bottom: 28px;
    }
    .info-note i { color: #d97706; margin-top: 1px; flex-shrink: 0; }

    .btn-home {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: 'Sarabun', sans-serif;
      cursor: pointer;
      text-decoration: none;
      transition: background .2s;
      margin-bottom: 12px;
    }
    .btn-home:hover { background: #245f3d; }

    .btn-history {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      background: #fff;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      font-family: 'Sarabun', sans-serif;
      cursor: pointer;
      text-decoration: none;
      transition: border-color .2s;
    }
    .btn-history:hover { border-color: var(--green); color: var(--green); }
  </style>
</head>
<body>
  <div class="card">
    <div class="check-circle">
      <i class="fa-solid fa-check"></i>
    </div>

    <h1>สั่งซื้อสำเร็จ!</h1>
    <p class="subtitle">คำสั่งซื้อของคุณได้รับการบันทึกแล้ว<br>เจ้าของสินค้าจะได้รับการแจ้งเตือนทันที</p>

    <div class="order-box">
      <div class="order-row">
        <span class="label">หมายเลขคำสั่งซื้อ</span>
        <span class="value id" id="orderId">#–</span>
      </div>
      <div class="order-row">
        <span class="label">วิธีชำระเงิน</span>
        <span class="value">💵 เก็บเงินปลายทาง (COD)</span>
      </div>
      <div class="order-row">
        <span class="label">สถานะ</span>
        <span class="value" style="color:#d97706;">⏳ รอยืนยันจากผู้ขาย</span>
      </div>
    </div>

    <div class="info-note">
      <i class="fa-solid fa-circle-info"></i>
      <span>กรุณาเตรียมเงินสดให้พร้อมเมื่อรับสินค้า ผู้ขายจะติดต่อกลับเพื่อนัดรับสินค้า</span>
    </div>

    <a href="home.html" class="btn-home">
      <i class="fa-solid fa-house"></i> กลับหน้าหลัก
    </a>
    <a href="tradehistory.html" class="btn-history">
      <i class="fa-solid fa-clock-rotate-left"></i> ดูประวัติคำสั่งซื้อ
    </a>
  </div>

  <script>
    const params  = new URLSearchParams(window.location.search);
    const orderId = params.get("order_id");
    if (orderId) {
      document.getElementById("orderId").textContent = "#" + orderId;
    }
  </script>
</body>
</html>
